[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", ".git", "n8n"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "ollama: requires a running Ollama server with the configured model",
]
