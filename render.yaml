# Render blueprint for the AI Lead Qualification demo.
#
# One Postgres database + one Docker web service. The service serves the API
# under /api/v1 and the static demo under /demo (same origin, so no CORS setup
# is required). Connect this repository in the Render dashboard and Render will
# read this file automatically ("Blueprint" flow).
#
# AI note: the app's optional AI layer targets a local Ollama server, which is
# not available on Render's free tier. OLLAMA_ENABLED=false makes the demo use
# the deterministic rules engine only. Qualification, scoring, CRM records,
# notifications and the (dry-run) follow-up email all keep working. See the
# README "Deployment" section for how to re-enable AI with a self-hosted model.

databases:
  - name: lead-automation-db
    plan: free
    databaseName: leads
    user: lead

services:
  - type: web
    name: lead-automation-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Create the schema from versioned migrations before the new release starts.
    # (If your plan does not support pre-deploy commands, set
    #  AUTO_CREATE_SCHEMA=true below instead and remove this line.)
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lead-automation-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: OLLAMA_ENABLED
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Optional: set a long random value to require the X-API-Key header.
      # - key: API_KEY
      #   generateValue: true
